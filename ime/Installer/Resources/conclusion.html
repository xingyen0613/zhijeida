<h2>安裝完成，還差兩步</h2>
<ol>
<li><strong>請重新開機。</strong>macOS 只在開機登入時掃描輸入法目錄，沒有重開機的話，下一步會找不到這個輸入法。</li>
<li>重開機後打開「<strong>系統設定 → 鍵盤 → 輸入來源 → 編輯</strong>」，按左下角的 <strong>+</strong>，
    選「<strong>繁體中文</strong>」，在清單裡找到 <strong>Zhijeida</strong>，按「加入」。</li>
</ol>
<p class="step">加入之後，用選單列右上角的輸入法選單（或 <strong>Control + Space</strong>）切到 Zhijeida 就能開始打字。
按鍵說明見專案的 README。</p>
</body></html>
